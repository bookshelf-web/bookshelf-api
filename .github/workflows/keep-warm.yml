name: Keep warm

# The hosted demo runs on free tiers that go to sleep: Render spins the API down
# after ~15 minutes idle and Supabase pauses a project after a week without
# activity. This pings both on weekdays so the demo and the E2E suites that run
# against it stay available.

on:
  schedule:
    # Every 14 minutes, 08:00-20:59 in Brasília (UTC-3), Monday to Friday.
    - cron: '*/14 11-23 * * 1-5'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      API_URL: https://bookshelf-api-wfzs.onrender.com
      FRONTEND_URL: https://bookshelf-web.github.io/bookshelf-frontend/
    steps:
      - name: Wake the API (cold starts can take a minute)
        run: |
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 20 --retry-all-errors --max-time 90 \
            "$API_URL/health"

      - name: Touch the database
        run: |
          # A rejected login still queries the users table, which counts as
          # database activity and keeps the hosted Postgres from pausing.
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 60 \
            --request POST "$API_URL/api/auth/login" \
            --header 'Content-Type: application/json' \
            --data '{"email":"keep-warm@example.com","password":"not-a-real-password"}')
          echo "Login probe returned HTTP $status"
          [ "$status" = "401" ]

      - name: Check the frontend
        run: curl --fail --silent --show-error --retry 3 --max-time 30 --output /dev/null "$FRONTEND_URL"
